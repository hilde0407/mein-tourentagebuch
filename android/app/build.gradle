plugins {
    id 'com.android.application'
}

android {
    namespace 'de.tourentagebuch.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.tourentagebuch.app'
        minSdk 26
        targetSdk 34
        versionCode 28
        versionName '1.8.1'
    }

    signingConfigs {
        debug {
            // Veröffentlichungen werden mit einem geheimen Schlüssel signiert, den der Bau über Umgebungsvariablen
            // bekommt (GitHub-Secrets, siehe docs/signieren.md). Ohne diese Variablen gilt der normale Android-Testschlüssel.
            if (System.getenv('MT_KEYSTORE')) {
                storeFile file(System.getenv('MT_KEYSTORE'))
                storePassword System.getenv('MT_STORE_PASS')
                keyAlias System.getenv('MT_KEY_ALIAS')
                keyPassword System.getenv('MT_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.hierynomus:smbj:0.13.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
