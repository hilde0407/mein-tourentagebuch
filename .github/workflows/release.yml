name: Veröffentlichen

# Legt die Veröffentlichung für die Version aus android/app/build.gradle an (Tag v<Version> auf dem
# aktuellen Stand von main) und baut danach die APK, die an die Veröffentlichung gehängt wird.
# Start: Actions -> „Veröffentlichen“ -> Run workflow. Die Beschreibung kommt aus docs/versionen/<Version>.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -oP "versionName '\K[0-9]+\.[0-9]+\.[0-9]+" android/app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Veröffentlichung anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V ist bereits veröffentlicht"; exit 1; fi
          N="docs/versionen/$V.md"
          [ -f "$N" ] || { mkdir -p docs/versionen; echo "Siehe die Änderungen in diesem Stand." > "$N"; }
          gh release create "v$V" --target "$GITHUB_SHA" --title "Mein Tourentagebuch $V" --notes-file "$N"
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    permissions:
      contents: write
