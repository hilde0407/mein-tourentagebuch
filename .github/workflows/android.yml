name: Android-App

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Veröffentlichung, an die die APK gehängt wird (z. B. v1.3.0) – leer lassen für einen reinen Testbau"
        required: false
        default: ""
  workflow_call:                 # von „Veröffentlichen“ aufgerufen; eine von GITHUB_TOKEN angelegte
    inputs:                      # Veröffentlichung löst selbst keinen Baulauf aus, darum der direkte Aufruf
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests (Parser, Aufzeichnungslogik, Wegansagen)
        run: |
          node tests/test_parse.js
          mkdir -p /tmp/jc
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/TrackStore.java tests/android/TrackStoreCheck.java
          java -cp /tmp/jc TrackStoreCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/Guide.java tests/android/GuideCheck.java
          java -cp /tmp/jc GuideCheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oberfläche im Browser prüfen
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          python tests/test_web.py
      - name: Android-SDK-Lizenzen akzeptieren
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bauen
        run: |
          gradle -p android assembleDebug
          cp android/app/build/outputs/apk/debug/*.apk Tourentagebuch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tourentagebuch-apk
          path: Tourentagebuch.apk
      - name: APK an die Veröffentlichung anhängen
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" Tourentagebuch.apk --clobber
