name: Android-App

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Veröffentlichung, an die die APK gehängt wird (z. B. v1.3.0) – leer lassen für einen reinen Testbau"
        required: false
        default: ""
  workflow_call:                 # von „Veröffentlichen“ aufgerufen; eine von GITHUB_TOKEN angelegte
    inputs:                      # Veröffentlichung löst selbst keinen Baulauf aus, darum der direkte Aufruf
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests (Parser, Aufzeichnungslogik, Wiederherstellung, Wegansagen, Video-Umwandlung, Foto-Größen, Medien-Sicherung, Offline-Karten)
        run: |
          node tests/test_parse.js
          node tests/test_calc.js
          mkdir -p /tmp/jc
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/TrackStore.java android/app/src/main/java/de/tourentagebuch/app/RecoveryPlan.java tests/android/TrackStoreCheck.java
          java -cp /tmp/jc TrackStoreCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/TrackStore.java android/app/src/main/java/de/tourentagebuch/app/RecoveryPlan.java tests/android/RecoveryPlanCheck.java
          java -cp /tmp/jc RecoveryPlanCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/Guide.java tests/android/GuideCheck.java
          java -cp /tmp/jc GuideCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/UploadRoute.java tests/android/UploadServerCheck.java
          java -cp /tmp/jc UploadServerCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/VideoPlan.java tests/android/VideoPlanCheck.java
          java -cp /tmp/jc VideoPlanCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/ImagePlan.java tests/android/ImagePlanCheck.java
          java -cp /tmp/jc ImagePlanCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/MediaZip.java tests/android/MediaZipCheck.java
          java -cp /tmp/jc MediaZipCheck
          javac -d /tmp/jc android/app/src/main/java/de/tourentagebuch/app/TilePlan.java tests/android/TilePlanCheck.java
          java -cp /tmp/jc TilePlanCheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oberfläche im Browser prüfen
        run: |
          pip install playwright pillow pypdf
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          python tests/test_web.py
          python tests/audit_kontrast.py --fail
      - name: Android-SDK-Lizenzen akzeptieren
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Signierschlüssel bereitstellen (nur Veröffentlichungen)
        if: inputs.tag != ''
        env:
          KS: ${{ secrets.MT_KEYSTORE_B64 }}
          SP: ${{ secrets.MT_STORE_PASS }}
          KP: ${{ secrets.MT_KEY_PASS }}
          KA: ${{ secrets.MT_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KP" ] || [ -z "$KA" ]; then
            echo "::error::Signierschlüssel fehlt: die vier Repository-Secrets MT_KEYSTORE_B64, MT_STORE_PASS, MT_KEY_PASS und MT_KEY_ALIAS anlegen (docs/signieren.md)."; exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/mt.jks"
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          { echo "MT_KEYSTORE=$RUNNER_TEMP/mt.jks"; echo "MT_STORE_PASS=$SP"; echo "MT_KEY_PASS=$KP"; echo "MT_KEY_ALIAS=$KA"; } >> "$GITHUB_ENV"
      - name: APK bauen
        run: |
          gradle -p android assembleDebug
          cp android/app/build/outputs/apk/debug/*.apk Tourentagebuch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tourentagebuch-apk
          path: Tourentagebuch.apk
      - name: APK an die Veröffentlichung anhängen
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" Tourentagebuch.apk --clobber
      # Prüfsumme der tatsächlich angehängten APK (heruntergeladen, nicht die lokale Kopie).
      # Ein Fehler hier lässt den Schritt rot erscheinen, hält den Lauf aber nicht an; die APK ist dann schon angehängt.
      # Mehrfaches Ausführen (z. B. nachträgliches Anhängen per Hand) ersetzt Datei und Abschnitt, es entsteht nichts doppelt.
      - name: Prüfsumme (SHA-256) anhängen und in die Beschreibung schreiben
        if: inputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          trap 'echo "::error::Prüfsumme konnte nicht angehängt werden (die APK ist trotzdem angehängt). Nachholen: Actions -> Android-App -> Run workflow mit Tag $TAG."' ERR
          set -eE
          D="$RUNNER_TEMP/pruefsumme"; rm -rf "$D"; mkdir -p "$D"
          gh release download "$TAG" --pattern Tourentagebuch.apk --dir "$D" --clobber
          ( cd "$D" && sha256sum Tourentagebuch.apk > Tourentagebuch.apk.sha256 )
          H=$(cut -d' ' -f1 "$D/Tourentagebuch.apk.sha256")
          [[ "$H" =~ ^[0-9a-f]{64}$ ]] || { echo "Ungültiger Hash: $H"; exit 1; }
          gh release upload "$TAG" "$D/Tourentagebuch.apk.sha256" --clobber
          # bestehende Beschreibung ohne einen früheren Prüfsummen-Abschnitt (bis zur nächsten Überschrift)
          gh release view "$TAG" --json body --jq .body | tr -d '\r' | awk '
            /^## Prüfsumme \(SHA-256\)[[:space:]]*$/ { skip=1; next }
            skip && /^## / { skip=0 }
            !skip { print }' > "$D/alt.md"
          # Leerzeilen am Ende entfernen
          sed -i -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' "$D/alt.md"
          {
            cat "$D/alt.md"
            [ -s "$D/alt.md" ] && printf '\n'
            printf '## Prüfsumme (SHA-256)\n\n`%s`\n\nSo prüfst du: `sha256sum Tourentagebuch.apk`\n' "$H"
          } > "$D/neu.md"
          gh release edit "$TAG" --notes-file "$D/neu.md"
          echo "SHA-256 von Tourentagebuch.apk ($TAG): $H" >> "$GITHUB_STEP_SUMMARY"
